# XcodeGen spec – the single source of truth for NovaPlayer.xcodeproj (generated, git-ignored).
#   cd apple && xcodegen generate
# iOS and tvOS targets share ONE bundle id (APP_BUNDLE_ID) → Universal Purchase.
name: NovaPlayer
options:
  bundleIdPrefix: com.hasielektronic
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Simulator builds need no team: ad-hoc ("Sign to Run Locally"). Set your team for devices.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  IPTVCore:
    path: IPTVCore
  IPTVKit:
    path: IPTVKit

targetTemplates:
  NovaApp:
    type: application
    sources:
      - path: Shared
      - path: Config/license-keys.json
        buildPhase: resources
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../spec/test-vectors/stream-samples.json
        buildPhase: resources
    dependencies:
      - package: IPTVCore
      - package: IPTVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: NovaPlayer
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        CODE_SIGN_ENTITLEMENTS: Config/NovaPlayer.entitlements
      configs:
        Debug:
          # get-task-allow: needed by local StoreKit testing (SKTestSession) in the simulator.
          CODE_SIGN_ENTITLEMENTS: Config/NovaPlayer-Debug.entitlements
    info:
      path: Apps/${target_name}-Info.plist
      properties: &commonInfo
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BACKEND_BASE_URL: $(BACKEND_BASE_URL)
        PRODUCT_LIFETIME: $(PRODUCT_LIFETIME)
        PRODUCT_TRIAL: $(PRODUCT_TRIAL)
        APP_BUNDLE_ID: $(APP_BUNDLE_ID)
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations: [en, tr]
        # Users add arbitrary (mostly plain-HTTP) IPTV servers (ARCHITECTURE V17).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

targets:
  NovaPlayer-iOS:
    templates: [NovaApp]
    platform: iOS
    sources:
      - path: Apps/iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Apps/NovaPlayer-iOS-Info.plist
      properties:
        <<: *commonInfo
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark

  NovaPlayer-tvOS:
    templates: [NovaApp]
    platform: tvOS
    sources:
      - path: Apps/tvOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
    info:
      path: Apps/NovaPlayer-tvOS-Info.plist
      properties:
        <<: *commonInfo
        UIUserInterfaceStyle: Dark
        UIRequiredDeviceCapabilities: [arm64]

  # StoreKit flows (purchase, Ask to Buy, refund, restore) against Config/Products.storekit.
  NovaPlayerStoreKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests/iOS
      - path: Config/Products.storekit
        buildPhase: resources
    dependencies:
      - target: NovaPlayer-iOS
      - package: IPTVCore
      - package: IPTVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.hasielektronik.novaplayer.storekittests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/NovaPlayer.app/NovaPlayer
        BUNDLE_LOADER: $(TEST_HOST)

  NovaPlayer-iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/iOS
      - path: UITests/Shared
    dependencies:
      - target: NovaPlayer-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.hasielektronik.novaplayer.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NovaPlayer-iOS

  NovaPlayer-tvOSUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: UITests/tvOS
      - path: UITests/Shared
    dependencies:
      - target: NovaPlayer-tvOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.hasielektronik.novaplayer.tvuitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NovaPlayer-tvOS

schemes:
  NovaPlayer-iOS:
    build:
      targets:
        NovaPlayer-iOS: all
    run:
      config: Debug
      storeKitConfiguration: Config/Products.storekit
    test:
      config: Debug
      targets:
        - NovaPlayerStoreKitTests
        - NovaPlayer-iOSUITests
    archive:
      config: Release
  NovaPlayer-tvOS:
    build:
      targets:
        NovaPlayer-tvOS: all
    run:
      config: Debug
      storeKitConfiguration: Config/Products.storekit
    test:
      config: Debug
      targets:
        - NovaPlayer-tvOSUITests
    archive:
      config: Release
