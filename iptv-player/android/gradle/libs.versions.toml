# Single version catalog for the whole Android family:
#  - the pure Kotlin/JVM `core` build (imports this file from core/settings.gradle.kts)
#  - the Android modules `:shared` and `:app` (root build).
# Versions verified to resolve on 2026-10-04 (Mac, Google Maven + Maven Central). Constraints:
# compileSdk/targetSdk 36 (newest installed platform), AGP 8.x + JDK 17, Kotlin 2.2.x,
# Media3 1.8.x, Play Billing 8.x. Newer majors (AGP 9, Kotlin 2.3+, Billing 9, androidx releases
# that require compileSdk 37) are intentionally not used yet.

[versions]
agp = "8.13.2"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"

# AndroidX / Google (resolved from Google Maven)
composeBom = "2025.12.01"
tvMaterial = "1.0.1"
media3 = "1.8.0"
playBilling = "8.3.0"
room = "2.8.4"
paging = "3.3.6"
navigationCompose = "2.9.6"
lifecycle = "2.9.4"
activityCompose = "1.11.0"
coreKtx = "1.17.0"
datastore = "1.1.7"
work = "2.11.0"

# Maven Central
coil = "3.3.0"
okhttp = "4.12.0"
okio = "3.16.0"
kotlinxSerialization = "1.9.0"
kotlinxCoroutines = "1.10.2"
zxing = "3.5.3"
kxml2 = "2.3.0"
junit5 = "5.13.4"
junit4 = "4.13.2"
robolectric = "4.16"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"
annotation = "1.9.1"

[libraries]
# Included build (android/core) – resolved by dependency substitution, no version.
iptvplayer-core = { module = "io.iptvplayer:core" }
# --- core (pure JVM) ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
kxml2 = { module = "net.sf.kxml:kxml2", version.ref = "kxml2" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit4 = { module = "junit:junit", version.ref = "junit4" }

# --- Android (Google Maven) ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
