# ---------------------------------------------------------------------------
# Product placeholders (CONTRACT §0). This is the ONLY place on Android where
# the product name / ids live – source code is name-neutral (io.iptvplayer.*).
# ---------------------------------------------------------------------------
APP_NAME=NovaPlayer
APP_ID=de.hasielektronik.novaplayer
PRODUCT_LIFETIME=lifetime_access
BACKEND_BASE_URL=https://iptv-backend.example.workers.dev

# ---------------------------------------------------------------------------
# Build settings
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
VERSION_NAME=1.0.0
VERSION_CODE=1
# Optional, debug builds only: local backend, e.g. http://10.0.2.2:8798 (emulator → host).
# Leave empty to use BACKEND_BASE_URL. Better: pass -PDEBUG_BACKEND_BASE_URL=… on the command line.
DEBUG_BACKEND_BASE_URL=
